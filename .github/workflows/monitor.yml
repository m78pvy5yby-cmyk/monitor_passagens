name: Monitor de passagens

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 8h (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo celular

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Consultar preços
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: >
          python monitor_passagens.py
          --origens GYN GRU
          --destino ZNZ
          --meses 2027-01 2027-02 2027-03
          --alerta 6000

      - name: Salvar histórico no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add historico_precos.csv || true
          git commit -m "Atualiza histórico de preços" || echo "Sem mudanças"
          git push
